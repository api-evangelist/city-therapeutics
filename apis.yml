aid: city-therapeutics
name: City Therapeutics
description: 'City Therapeutics, Inc. is a privately held, clinical-stage biotechnology
  company headquartered at 399 Binney Street in Kendall Square, Cambridge, Massachusetts,
  founded in 2024 by pioneers of RNA interference including John Maraganore, Phillip
  Zamore, Kotaro Nakanishi, Yukihide Tomari and Mark Keating. The company engineers
  next-generation RNAi trigger molecules — including its proprietary cleavage-inducing
  tiny (city) RNAs — and pairs them with precision targeting ligands designed to deliver
  siRNAs beyond the liver into ocular, CNS and other extrahepatic tissues. Its pipeline
  includes CITY-FXI, a Factor XI-targeting candidate for thromboembolic disease, and
  CITY-RBP4 for Stargardt disease and geographic atrophy, alongside undisclosed hepatic,
  ocular and CNS programs. City Therapeutics raised a $135M Series A in October 2024
  and a $99.5M Series B in June 2026, and holds research collaborations with Biogen
  and Bausch + Lomb. City Therapeutics publishes no public developer program, API,
  or machine-readable interface; it is catalogued here as a company profile only.'
